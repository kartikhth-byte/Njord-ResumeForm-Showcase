<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" role="img" aria-labelledby="title desc">
<title id="title">Optional search assistance</title><desc id="desc">Standard filters bypass AI. AI search requires ready embeddings. Staff are prompted to generate missing vectors. Retrieval displays results before additional reasoning. A human chooses any workflow status action.</desc>
<rect width="360" height="640" rx="12" fill="#f6f8fa"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#57606a"/></marker></defs>
<rect x="100" y="20" width="145" height="50" rx="7" fill="#ffffff" stroke="#34708c" stroke-width="1.5"/>
<text x="172.5" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172b4d"><tspan x="172.5" dy="0">Search</tspan></text>
<path d="M172 118 L230 166 L172 214 L114 166 Z" fill="#e8f3f7" stroke="#34708c" stroke-width="1.5"/>
<text x="172" y="163" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172b4d"><tspan x="172" dy="0">Vectors</tspan><tspan x="172" dy="18">ready?</tspan></text>
<path d="M172 70 L172 118" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="207" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#172b4d"><tspan x="207" dy="0">AI path</tspan></text>
<rect x="242" y="248" width="104" height="64" rx="7" fill="#ffffff" stroke="#34708c" stroke-width="1.5"/>
<text x="294.0" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172b4d"><tspan x="294.0" dy="0">Generate</tspan><tspan x="294.0" dy="18">vectors</tspan></text>
<path d="M230 166 L294 166 L294 248" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="271" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#172b4d"><tspan x="271" dy="0">No</tspan></text>
<rect x="107" y="269" width="130" height="50" rx="7" fill="#ffffff" stroke="#34708c" stroke-width="1.5"/>
<text x="172.0" y="299" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172b4d"><tspan x="172.0" dy="0">Retrieve</tspan></text>
<path d="M172 214 L172 269" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="191" y="243" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#172b4d"><tspan x="191" dy="0">Yes</tspan></text>
<rect x="231" y="378" width="115" height="50" rx="7" fill="#ffffff" stroke="#34708c" stroke-width="1.5"/>
<text x="288.5" y="408" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172b4d"><tspan x="288.5" dy="0">Reasoning</tspan></text>
<path d="M214 319 L288 351 L288 378" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="250" y="332" width="75" height="17" rx="3" fill="#f6f8fa"/>
<text x="287" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#172b4d"><tspan x="287" dy="0">Has results</tspan></text>
<rect x="105" y="478" width="135" height="50" rx="7" fill="#ffffff" stroke="#34708c" stroke-width="1.5"/>
<text x="172.5" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172b4d"><tspan x="172.5" dy="0">Review</tspan></text>
<path d="M131 319 L83 348 L83 503 L105 503" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M288 428 L288 503 L240 503" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M100 45 L30 45 L30 503 L105 503" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="53" y="231" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#172b4d"><tspan x="53" dy="0">Filters</tspan></text>
<rect x="105" y="578" width="135" height="50" rx="7" fill="#ffffff" stroke="#34708c" stroke-width="1.5"/>
<text x="172.5" y="608" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#172b4d"><tspan x="172.5" dy="0">Status action</tspan></text>
<path d="M172 528 L172 578" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
<text x="228" y="557" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#172b4d"><tspan x="228" dy="0">Human decision</tspan></text>
</svg>
